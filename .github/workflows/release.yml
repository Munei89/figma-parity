name: Release

# Publishes to npm when a GitHub release is published (e.g. tag v0.2.0).
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret needed — and
# attaches a provenance attestation automatically.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs typecheck, tests and build
      - run: npm publish
