<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo App - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      /* DRIFT 1: Font size should be 28px, not 24px */
      font-size: 24px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    p {
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #0066ff;
    }
    .button {
      width: 100%;
      /* DRIFT 2: Background should be #0066ff, not #0055ee */
      background: #0055ee;
      color: white;
      /* DRIFT 3: Padding should be "16px", not "12px" */
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .button:hover {
      background: #0052d9;
    }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #0066ff;
      text-decoration: none;
      font-size: 14px;
    }
    [data-testid="screen-login"] { display: contents; }
    [data-testid="login-form"] { display: contents; }
    [data-testid="email-input"] {}
    [data-testid="password-input"] {}
    [data-testid="login-button"] {}
  </style>
</head>
<body>
  <div data-testid="screen-login">
    <div class="login-container" data-testid="login-form">
      <h1>Welcome back</h1>
      <p>Sign in to your account to continue</p>
      
      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            data-testid="email-input"
            placeholder="you@example.com"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            data-testid="password-input"
            placeholder="Enter your password"
            required
          >
        </div>
        
        <button type="submit" class="button" data-testid="login-button">
          Sign in
        </button>
      </form>
      
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>
  </div>
</body>
</html>
